:root{
  --bg:#0A0A0A;
  --surface:#151118;
  --surface-2:#1D1726;
  --surface-3:#251D33;
  --purple:#7C3AED;
  --purple-2:#A78BFA;
  --gold:#FFD700;
  --gold-soft:#FFF3A6;
  --text:#FFFDF6;
  --muted:#C6BFD6;
  --muted-2:#8F869E;
  --line:rgba(255,255,255,.11);
  --success:#34D399;
  --danger:#FB7185;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0A0A;
    --surface:#151118;
    --text:#FFFDF6;
    --muted:#C6BFD6;
  }
}

*{
  -webkit-tap-highlight-color: transparent;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind','Sora',system-ui,sans-serif;
}

.font-display{
  font-family:'Sora',system-ui,sans-serif;
}

.glass{
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(16px);
}

.gold-text{
  background:linear-gradient(90deg,#FFD700,#FFF3A6,#F59E0B);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.purple-glow{
  box-shadow:0 18px 50px rgba(124,58,237,.38), inset 0 1px 0 rgba(255,255,255,.18);
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.45)
  }

  100%{
    box-shadow:0 0 0 18px rgba(255,215,0,0)
  }
}

@keyframes beatPop{
  0%{
    transform:scale(1)
  }

  40%{
    transform:scale(1.18)
  }

  100%{
    transform:scale(1)
  }
}

.animate-floaty{
  animation:floaty 3.2s ease-in-out infinite;
}

.animate-pulse-ring{
  animation:pulse-ring 1.1s ease-out infinite;
}

.animate-beat{
  animation:beatPop .28s ease-out;
}

input[type=range]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  height:6px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--gold));
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  border:5px solid var(--purple);
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  cursor:pointer;
}

.placeholder\:text-\[var\(--muted-2\)\]::-moz-placeholder{
  color: var(--muted-2);
}

.placeholder\:text-\[var\(--muted-2\)\]::placeholder{
  color: var(--muted-2);
}

.active\:scale-95:active{

}

.active\:scale-\[\.97\]:active{
  --tw-scale-x: .97;
  --tw-scale-y: .97;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:bg-\[var\(--gold\)\]:active{
  background-color: var(--gold);
}

.active\:bg-\[var\(--purple\)\]:active{
  background-color: var(--purple);
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:items-center{
    align-items: center;
  }
}
